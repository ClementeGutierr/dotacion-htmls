<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OLIVIA MDE — Dotación</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0e14;--surface:#151821;--surface2:#1c1f2b;--border:#262a38;--text:#e2e8f0;--muted:#6b7588;--muted2:#4a5068;--over:#c2410c;--under:#818cf8;--green:#22c55e;--red:#ef4444;--yellow:#facc15;--blue:#3b82f6;--salon:#f59e0b;--cocina:#ef4444;--barra:#3b82f6;--admin:#10b981}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding:12px 16px}
.header{padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:12px}
.header h1{font-size:18px;font-weight:700}.header .sub{font-size:12px;color:var(--muted)}
.pdv-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pdv-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.pdv-btn:hover{border-color:var(--muted)}.pdv-btn.active{background:var(--green);color:#000;border-color:var(--green);font-weight:700}
.day-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.day-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.day-btn:hover{border-color:var(--muted)}.day-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.grids{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;overflow:hidden}
.panel-hdr{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-weight:700;font-size:14px}
.panel-dot{width:8px;height:8px;border-radius:50%}
table.sched{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:12px}
table.sched th{color:var(--muted);font-weight:500;padding:3px 4px;font-size:11px}
table.sched td{padding:3px 5px;text-align:center}
.frs{writing-mode:vertical-lr;transform:rotate(180deg);font-size:9px;color:var(--muted2);letter-spacing:1px;font-weight:600}
.row-ov{background:rgba(194,65,12,.12)}.row-un{background:rgba(129,140,248,.08)}
.chip{font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px}
.chip.cov{color:var(--over)}.chip.cun{color:var(--under)}.chip.cok{color:var(--muted2)}
.sum-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.scard{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:130px;flex:1}
.scard-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.scard-val{font-size:22px;font-weight:700;margin-top:2px}.scard-sub{font-size:11px;color:var(--muted);margin-top:2px}
.inc-section,.jorn-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:16px}
.inc-title{font-size:14px;font-weight:700;color:var(--yellow);margin-bottom:8px}
.jorn-title{font-size:14px;font-weight:700;color:var(--red);margin-bottom:8px}
.inc-table{width:100%;border-collapse:collapse;font-size:13px}
.inc-table th{text-align:left;color:var(--muted);font-weight:500;padding:4px 8px;border-bottom:1px solid var(--border)}
.inc-table td{padding:4px 8px}
.track-section{margin-top:20px;border-top:2px solid var(--border);padding-top:16px}
.track-title{font-size:16px;font-weight:700;margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:4px}
.ldot{width:10px;height:10px;border-radius:2px;display:inline-block}</style>
</head>

  }).sort(function(a,b){return (b.totReal-b.totProg)-(a.totReal-a.totProg);});

    var pdv=ps.pdv,totMeta=ps.totMeta,totProg=ps.totProg,totReal=ps.totReal,dayT=ps.dayT;
    t+='<tr>';
    t+='<td style="text-align:left;font-family:DM Sans,sans-serif;font-weight:600;font-size:12px;padding:4px 6px;color:var(--text);border-bottom:none;cursor:pointer" onclick="curPDV=\''+pdv+'\';render();">'+pdv+'</td>';
    dks.forEach(function(dk){
      var dp=Math.round(dayT[dk].p);var dr=Math.round(dayT[dk].r*10)/10;var dd=dr-dp;
      var cls=dd>2?' class="row-ov"':dd<-2?' class="row-un"':'';
      var rc=dd>2?'var(--over)':dd<-2?'var(--under)':'var(--green)';
      t+='<td'+cls+' style="padding:3px 3px;opacity:.5;border-bottom:none">'+dp+'</td>';
      t+='<td'+cls+' style="padding:3px 3px;font-weight:600;color:'+rc+';border-bottom:none;'+bdrR+'">'+dr+'</td>';
    });
    var pdvDiff=totReal-totProg;var pdvColor=pdvDiff>2?'var(--over)':pdvDiff<-2?'var(--under)':'var(--green)';
    t+='<td style="padding:2px 1px;opacity:.5;border-bottom:none;border-left:2px solid var(--border);text-align:center">'+Math.round(totProg)+'</td>';
    t+='<td style="padding:2px 1px;font-weight:700;color:'+pdvColor+';border-bottom:none;text-align:center">'+Math.round(totReal*10)/10+'</td>';
    t+='<td style="padding:2px 1px;font-weight:600;color:'+pdvColor+';border-bottom:none;font-size:11px;text-align:center">'+(pdvDiff>0?'+':'')+Math.round(pdvDiff*10)/10+'</td>';
    t+='</tr>';
    var pR=totMeta>0?Math.min(totReal/totMeta*100,100):0;
    var pE=totMeta>0?Math.min(totProg/totMeta*100,100):0;
    var bC=pdvDiff>2?'var(--over)':pdvDiff<-2?'var(--under)':'var(--green)';
    var cols=3+dks.length*2;
    t+='<tr><td colspan="'+cols+'" style="padding:0 6px 6px 6px;border-bottom:1px solid var(--surface2)">';
    t+='<div style="display:flex;align-items:center;gap:6px">';
    t+='<div style="flex:1;height:4px;background:var(--surface2);border-radius:2px;position:relative;overflow:visible">';
    t+='<div style="width:'+pR+'%;height:100%;background:'+bC+';border-radius:2px;position:relative;z-index:1"></div>';
    t+='<div style="position:absolute;left:'+pE+'%;top:-3px;width:2px;height:10px;background:var(--muted2);z-index:2;border-radius:1px"></div>';
    t+='<div style="position:absolute;left:calc('+pE+'% - 3px);top:-5px;width:8px;height:8px;background:#fff;border-radius:50%;z-index:3;box-shadow:0 0 3px rgba(0,0,0,.5)"></div>';
    t+='</div></div></td></tr>';
  });
  t+='</tbody></table>';
  var tw=document.createElement('div');tw.style.cssText='overflow-x:auto';tw.innerHTML=t;
  panel.appendChild(tw);sec.appendChild(panel);ct.appendChild(sec);
}

render();

</script>
