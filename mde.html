<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta http-equiv="refresh" content="300">
<title>OLIVIA MDE — Dotación</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0e14;--surface:#151821;--surface2:#1c1f2b;--border:#262a38;--text:#e2e8f0;--muted:#6b7588;--muted2:#4a5068;--over:#c2410c;--under:#818cf8;--green:#22c55e;--red:#ef4444;--yellow:#facc15;--blue:#3b82f6;--salon:#f59e0b;--cocina:#ef4444;--barra:#3b82f6;--admin:#10b981}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding:12px 16px}
.header{padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:12px}
.header h1{font-size:18px;font-weight:700}.header .sub{font-size:12px;color:var(--muted)}
.pdv-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pdv-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.pdv-btn:hover{border-color:var(--muted)}.pdv-btn.active{background:var(--green);color:#000;border-color:var(--green);font-weight:700}
.day-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.day-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.day-btn:hover{border-color:var(--muted)}.day-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.grids{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;overflow:hidden}
.panel-hdr{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-weight:700;font-size:14px}
.panel-dot{width:8px;height:8px;border-radius:50%}
table.sched{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:12px}
table.sched th{color:var(--muted);font-weight:500;padding:3px 4px;font-size:11px}
table.sched td{padding:3px 5px;text-align:center}
.frs{writing-mode:vertical-lr;transform:rotate(180deg);font-size:9px;color:var(--muted2);letter-spacing:1px;font-weight:600}
.row-ov{background:rgba(194,65,12,.12)}.row-un{background:rgba(129,140,248,.08)}
.chip{font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px}
.chip.cov{color:var(--over)}.chip.cun{color:var(--under)}.chip.cok{color:var(--muted2)}
.sum-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.scard{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:130px;flex:1}
.scard-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.scard-val{font-size:22px;font-weight:700;margin-top:2px}.scard-sub{font-size:11px;color:var(--muted);margin-top:2px}
.inc-section,.jorn-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:16px}
.inc-title{font-size:14px;font-weight:700;color:var(--yellow);margin-bottom:8px}
.jorn-title{font-size:14px;font-weight:700;color:var(--red);margin-bottom:8px}
.inc-table{width:100%;border-collapse:collapse;font-size:13px}
.inc-table th{text-align:left;color:var(--muted);font-weight:500;padding:4px 8px;border-bottom:1px solid var(--border)}
.inc-table td{padding:4px 8px}
.track-section{margin-top:20px;border-top:2px solid var(--border);padding-top:16px}
.track-title{font-size:16px;font-weight:700;margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:4px}
.ldot{width:10px;height:10px;border-radius:2px;display:inline-block}
.mes-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mes-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:3px 10px;border-radius:12px;font-size:11px;text-decoration:none}
.mes-btn:hover{border-color:var(--muted);color:var(--text)}.mes-btn.active{background:var(--surface2);color:var(--text);border-color:var(--muted2);font-weight:600}
.upd-badge{position:fixed;top:8px;right:12px;background:rgba(0,0,0,0.55);color:#9fb4d8;padding:4px 10px;border-radius:6px;font-size:11px;z-index:9999;pointer-events:none}</style>
</head>

/* Mes cerrado = el ultimo dia procesado es el ultimo del mes. En el mes en curso
   se muestran horas de mas y ocio TOTALES (con TC/MT debajo); al cierre el MT
   pasa a NETO (de mas menos ocio) y el ocio queda solo de TC. */
function _mesCerrado(){
  try{var dk=DAYS[DAYS.length-1];var e0=null;for(var p in STAFF_TRACK){var l=STAFF_TRACK[p]||[];for(var i=0;i<l.length;i++){if(l[i].dias&&l[i].dias[dk]){e0=l[i];break;}}if(e0)break;}

function _statsDe(track){
  var o={he:0,dmTc:0,dmMt:0,ocMt:0,idleTc:0,countTc:0,countMt:0,totProg:0,sinMarca:0,heP:0,nHeP:0,dmMtP:0,ocMtP:0,ocTcP:0};
  var cerrado=_mesCerrado();
  track.forEach(function(e){
    if(esVac(e)||e.zona==='Admin'||e.admin_solo_r) return;
    /* Sin una sola hora en el mes: se saca del ocio cuando ya lleva 5 o mas dias
       en X (o el mes cerro). Al arrancar el mes, un descanso o una falta de un
       dia no lo convierte en "retiro sin cargar". */
    if(!(e.acum_real>0)){
      var nx=0;for(var k in (e.dias||{})){var d=e.dias[k];if(d&&d.alert==='FALTA')nx++;}
      if(cerrado||nx>=5){o.sinMarca++;return;}
    }
    o.totProg+=e.acum_prog;
    var tx=(e.tope_extra!=null)?e.tope_extra:e.meta;
    if(tx>0&&e.acum_real>tx){o.he+=Math.round((e.acum_real-tx)*10)/10;}
    var d=Math.round((e.acum_real-e.acum_prog)*10)/10;
    if(e.tipo==='MT'||e.tipo==='SAB'){o.countMt++;if(d>0)o.dmMt+=d;else o.ocMt+=-d;}
    else{o.countTc++;if(d>0)o.dmTc+=d;else o.idleTc+=-d;}
    /* 24-oct-2026 (Clemente): tarjetas PROYECTADAS, todas contra el tope a fin de mes.
       Hora extra = proyectado sobre el tope de extra (TC y MT). MT de mas = proyectado
       sobre SU programado (lo que no es extra). Ocio = tope menos proyectado, TC y MT. */
    var px=(e.proy!=null)?e.proy:e.acum_real;
    if(tx>0&&px>tx){o.heP+=Math.round((px-tx)*10)/10;o.nHeP++;}
    if(e.meta>0){var pd=Math.round((px-e.meta)*10)/10;
      if(e.tipo==='MT'||e.tipo==='SAB'){if(pd>0)o.dmMtP+=pd;else o.ocMtP+=-pd;}
      else{if(pd<0)o.ocTcP+=-pd;}}
  });
  o.netMt=o.dmMt-o.ocMt;o.dm=o.dmTc+o.dmMt;o.oc=o.idleTc+o.ocMt;o.ocP=o.ocTcP+o.ocMtP;o.cerrado=cerrado;return o;
}

/* APOYOS DEL DIA (13-oct-2026, Clemente): el admin registra que un supernumerario
   o flotante le apoyo un dia. Se guarda en la hoja de apoyos (Apps Script) y en
   la proxima actualizacion sus marcas de ese dia suman a las personas por hora
   de este punto. Una persona solo puede estar en UN punto por dia. */
function _apoyoFechas(){
  var out=[];if(typeof APOYOS==='undefined'||!APOYOS)return out;
  var p=APOYOS.hoy.split('-');var y=+p[0],m=+p[1],d=+p[2];
  for(var i=1;i<=d;i++){out.push(y+'-'+(m<10?'0':'')+m+'-'+(i<10?'0':'')+i);}
  return out.reverse();
}
function _isoDeDia(dk){
  for(var p in STAFF_TRACK){var l=STAFF_TRACK[p]||[];for(var i=0;i<l.length;i++){var d=(l[i].dias||{})[dk];if(d&&d.fecha_iso)return d.fecha_iso;}}
  return null;
}

      var cls=dd>2?' class="row-ov"':dd<-2?' class="row-un"':'';
      var rc=dd>2?'var(--over)':dd<-2?'var(--under)':'var(--green)';
      t+='<td'+cls+' style="padding:3px 3px;opacity:.5;border-bottom:none">'+dp+'</td>';
      t+='<td'+cls+' style="padding:3px 3px;font-weight:600;color:'+rc+';border-bottom:none;'+bdrR+'">'+dr+'</td>';
    });
    var pdvDiff=totReal-totProg;
    /* COLOR 26-ago (Clemente): manda la hora extra. Si el punto paga extras va
       en rojo aunque el neto sea negativo por gente que trabajo de menos. */
    var pdvColor=totEx>2?'var(--over)':pdvDiff<-2?'var(--under)':'var(--green)';
    t+='<td style="padding:2px 1px;opacity:.5;border-bottom:none;border-left:2px solid var(--border);text-align:center">'+Math.round(totProg)+'</td>';
    t+='<td style="padding:2px 1px;font-weight:700;color:'+pdvColor+';border-bottom:none;text-align:center">'+Math.round(totReal*10)/10+'</td>';
    t+='<td style="padding:2px 1px;font-weight:600;color:'+pdvColor+';border-bottom:none;font-size:11px;text-align:center">'+(pdvDiff>0?'+':'')+Math.round(pdvDiff*10)/10+'</td>';
    /* Extra = suma de excesos individuales: es lo que de verdad se paga */
    t+='<td style="padding:2px 1px;font-weight:700;color:'+(totEx>0?'var(--over)':'var(--muted2)')+';border-bottom:none;font-size:11px;text-align:center">'+(totEx>0?'+'+Math.round(totEx*10)/10:'0')+'</td>';
    t+='</tr>';
    var pR=totMeta>0?Math.min(totReal/totMeta*100,100):0;
    var pE=totMeta>0?Math.min(totProg/totMeta*100,100):0;
    var bC=totEx>2?'var(--over)':pdvDiff<-2?'var(--under)':'var(--green)';
    var cols=4+dks.length*2;
    t+='<tr><td colspan="'+cols+'" style="padding:0 6px 6px 6px;border-bottom:1px solid var(--surface2)">';
    t+='<div style="display:flex;align-items:center;gap:6px">';
    t+='<div style="flex:1;height:4px;background:var(--surface2);border-radius:2px;position:relative;overflow:visible">';
    t+='<div style="width:'+pR+'%;height:100%;background:'+bC+';border-radius:2px;position:relative;z-index:1"></div>';
    t+='<div style="position:absolute;left:'+pE+'%;top:-3px;width:2px;height:10px;background:var(--muted2);z-index:2;border-radius:1px"></div>';
    t+='<div style="position:absolute;left:calc('+pE+'% - 3px);top:-5px;width:8px;height:8px;background:#fff;border-radius:50%;z-index:3;box-shadow:0 0 3px rgba(0,0,0,.5)"></div>';
    t+='</div></div></td></tr>';
  });
  t+='</tbody></table>';
  /* FIX 26-ago-2026 (Clemente): faltaba el contenedor con overflow-x. En la
     vista de MES la tabla trae una columna por dia (hasta 31) y se salia de la
     pantalla sin poder desplazarla; las otras tablas si lo tenian (ver el
     mismo patron en renderCity). */
  var tw=document.createElement('div');tw.style.cssText='overflow-x:auto';tw.innerHTML=t;
  panel.appendChild(tw);
  sec.appendChild(panel);
  ct.appendChild(sec);
}

/* Modal P - click en celda P del control individual */
function mostrarModalP(pdv, doc, dayKey){
  if(typeof STAFF_TRACK==='undefined') return;
  var track=STAFF_TRACK[pdv]; if(!track) return;
  var emp=null;
  for(var i=0;i<track.length;i++){ if(String(track[i].doc)===String(doc)){emp=track[i];break;} }
  if(!emp||!emp.dias||!emp.dias[dayKey]) return;
  var d=emp.dias[dayKey];
  var pad2=function(n){return n<10?'0'+n:''+n;};
  // Dias en HTML entities: L,M,Miercoles,J,V,Sabado,D
  var diaSemArr=['Lunes','Martes','Mi&#233;rcoles','Jueves','Viernes','S&#225;bado','Domingo','Lunes','Martes','Mi&#233;rcoles','Jueves','Viernes','S&#225;bado','Domingo'];
  var mesesEs=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var catIdx=(d.cat_idx!==undefined)?d.cat_idx:0;
  var diaSem=diaSemArr[catIdx]||'';
  var sem=(catIdx<7)?'S1':'S2';
  var headerTxt=diaSem+' '+sem;
  if(d.fecha_iso){
    var p=d.fecha_iso.split('-');
    if(p.length===3){
      var dd=parseInt(p[2],10), mm=parseInt(p[1],10);
      if(!isNaN(dd)&&!isNaN(mm)&&mm>=1&&mm<=12) headerTxt+=' &#183; '+dd+' de '+mesesEs[mm-1];
    }
  }
  var turnos=d.turnos||[];
  var turnosHtml='';
  function fmtRange(h1,h2){ return pad2(h1)+':00 &#8594; '+pad2(h2)+':00'; }
  for(var j=0;j<turnos.length;j++){
    var t=turnos[j], rng='';
    if(typeof t==='string' && t.indexOf('-')>=0){
      var pp=t.split('-'); var h1=parseInt(pp[0],10), h2=parseInt(pp[1],10);
      if(!isNaN(h1)&&!isNaN(h2)) rng=fmtRange(h1,h2);
    } else if(Array.isArray(t) && t.length===2){
      rng=fmtRange(parseInt(t[0],10), parseInt(t[1],10));
    }
    if(rng) turnosHtml+='<div style="font-family:JetBrains Mono,monospace;font-size:14px;color:var(--green);margin-top:4px">'+rng+'</div>';
  }
  if(!turnosHtml){
    var _kd=d.desc||'';
    var _tdesc=_kd==='DC'?'Descanso compensatorio (DC) \u2014 baja el tope 7 h':_kd==='DNL'?'Descanso no laborado (DNL) \u2014 no baja el tope':'Descanso';
    if(d.novedad==='DC-F')_tdesc+=' \u00b7 festivo no trabajado';
    if(d.status==='DESC'||d.novedad==='DC'||d.novedad==='DC-F'||d.novedad==='DNL') turnosHtml='<div style="color:var(--muted);font-size:13px;margin-top:4px">'+_tdesc+'</div>';
    else if(d.status==='NOVEDAD') turnosHtml='<div style="color:var(--muted);font-size:13px;margin-top:4px">Novedad: '+(d.novedad||'').toString()+'</div>';
    else turnosHtml='<div style="color:var(--muted);font-size:13px;margin-top:4px">Sin turno programado</div>';
  }
  /* 19-oct-2026 (Clemente): la alerta de revision tambien en el modal de la jornada */
  if(d.rev) turnosHtml='<div style="background:#422006;border:1px solid #ca8a04;color:#fde047;border-radius:6px;padding:8px 10px;font-size:12px;margin:2px 0 8px">&#9888; '+String(d.rev).replace(/^REVISAR:\s*/,'')+'<div style="color:#fbbf24;opacity:.8;margin-top:3px">Corregir en SoftControl</div></div>'+turnosHtml;
  var prev=document.getElementById('modal-p-overlay'); if(prev) prev.remove();
  var overlay=document.createElement('div');
  overlay.id='modal-p-overlay';
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;';
  var card=document.createElement('div');
  card.style.cssText='background:#0f1117;border:1px solid #333;border-radius:10px;min-width:320px;max-width:90vw;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.6);font-family:DM Sans,sans-serif;';
  var html='<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #262a38">';
  html+='<div style="font-weight:600;font-size:14px;color:var(--text)">'+headerTxt+'</div>';
  html+='<div id="modal-p-close" style="cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:0 4px;user-select:none">&times;</div>';
  html+='</div>';
  html+='<div style="padding:14px 18px">';
  html+='<div style="font-weight:600;font-size:15px;color:var(--text);margin-bottom:4px">'+emp.nombre+'</div>';
  html+='<div style="color:var(--muted);font-size:12px;margin-bottom:12px;font-family:JetBrains Mono,monospace">CC: '+emp.doc+'</div>';
  html+='<div style="color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:.5px">Turno programado</div>';
  html+=turnosHtml;
  // FIX 17-jul: mostrar rangos reales ENTâ†’SAL (marcaciones del dÃ­a)
  var turnosR=d.turnos_reales||[];
  if(turnosR.length>0){
    html+='<div style="color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-top:12px">Horario real</div>';
    for(var k=0;k<turnosR.length;k++){
      var tr=String(turnosR[k]).replace(/â†’|->/,' &#8594; ');
      html+='<div style="font-family:JetBrains Mono,monospace;font-size:14px;color:#38bdf8;margin-top:4px">'+tr+'</div>';
    }
  }
  // FIX 17-jul: agregar bloque horas reales + diff
  var progH=(typeof d.prog==='number')?d.prog:0;
  var realH=(typeof d.real==='number')?d.real:0;
  var diffH=Math.round((realH-progH)*10)/10;
  var diffColor=diffH>0.5?'var(--over)':(diffH<-0.5?'var(--under)':'var(--green)');
  var diffTxt=(diffH>0?'+':'')+diffH+'h';
  html+='<div style="margin-top:14px;padding-top:12px;border-top:1px solid #262a38">';
  html+='<div style="color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:.5px">Resumen del d&#237;a</div>';
  html+='<div style="display:flex;gap:18px;margin-top:6px;font-family:JetBrains Mono,monospace;font-size:13px">';
  html+='<div><span style="color:var(--muted)">Prog:</span> <span style="color:var(--text);font-weight:600">'+(progH+' h')+'</span></div>';
  html+='<div><span style="color:var(--muted)">Real:</span> <span style="color:var(--text);font-weight:600">'+realH+' h</span></div>';
  html+='<div><span style="color:var(--muted)">Dif:</span> <span style="color:'+diffColor+';font-weight:600">'+diffTxt+'</span></div>';
  html+='</div>';
  if(d.alert && d.alert!==''){
    var alertMap={FALTA:'Falt&#243;',DEFICIT:'D&#233;ficit',EXCESO:'Exceso',EXTRA_DESC:'Trabaj&#243; en descanso',NOVEDAD:'Novedad',INC:'Marcaci&#243;n incompleta'};
    var alertTxt=alertMap[d.alert]||d.alert;
    html+='<div style="margin-top:8px;font-size:11px;color:var(--muted);font-style:italic">Alerta: '+alertTxt+'</div>';
  }
  html+='</div>';
  html+='</div>';
  card.innerHTML=html;
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  function cerrar(){
    var o=document.getElementById('modal-p-overlay'); if(o) o.remove();
    document.removeEventListener('keydown', escHandler);
  }
  function escHandler(e){ if(e.key==='Escape'||e.keyCode===27) cerrar(); }
  overlay.addEventListener('click', function(e){ if(e.target===overlay) cerrar(); });
  var closeBtn=document.getElementById('modal-p-close');
  if(closeBtn) closeBtn.addEventListener('click', cerrar);
  document.addEventListener('keydown', escHandler);
}



/* ============================================================
   Modal PERSONAS POR HORA (16-ago-2026, Clemente)
   Click en una fila del heatmap -> lista de quienes estaban
   PROGRAMADOS (gris) y quienes estuvieron REALMENTE (verde).
   Usa STAFF_TRACK: dias[dk].turnos (programado) y .turnos_reales.
   Misma regla del heatmap: cuenta la hora h quien entra <= h:30
   y sale >= h:31 (presente al menos media hora).
   ============================================================ */
function _rangoTurno(t){
  if(typeof t==='string'&&t.indexOf('-')>=0){
    var p=t.split('-'),a=parseInt(p[0],10),b=parseInt(p[1],10);
    if(!isNaN(a)&&!isNaN(b))return [a,b];
  }else if(Array.isArray(t)&&t.length===2){
    var a2=parseInt(t[0],10),b2=parseInt(t[1],10);
    if(!isNaN(a2)&&!isNaN(b2))return [a2,b2];
  }
  return null;
}
function _pad2(n){return n<10?'0'+n:''+n;}
function _progEnHora(d,h){
  var ts=(d&&d.turnos)||[];
  for(var i=0;i<ts.length;i++){
    var r=_rangoTurno(ts[i]);
    if(r&&h>=r[0]&&h<r[1]) return _pad2(r[0])+':00 \u2192 '+_pad2(r[1])+':00';
  }
  return null;
}
function _realEnHora(d,h){
  var ts=(d&&d.turnos_reales)||[];
  for(var i=0;i<ts.length;i++){
    var m=String(ts[i]).match(/(\d{1,2}):(\d{2})\D+(\d{1,2}):(\d{2})/);
    if(!m)continue;
    var e=(+m[1])*60+(+m[2]), s=(+m[3])*60+(+m[4]);
    if(s<e)s+=1440;
    if(e<=h*60+30&&s>=h*60+31) return _pad2(+m[1])+':'+m[2]+' \u2192 '+_pad2(+m[3])+':'+m[4];
  }
  return null;
}
function mostrarModalHora(pdv,area,h,dayKey){
  if(typeof STAFF_TRACK==='undefined')return;
  var esCiudad=(pdv==='__CIUDAD__');
  var pdvs=esCiudad?PDVS.slice():[pdv];
  var prog=[],real=[];
  pdvs.forEach(function(p){
    (STAFF_TRACK[p]||[]).forEach(function(e){
      /* Chicken (HOJA ESTANDAR) presupuesta todo en 'Personal' y su gente esta en
         Salon/Cocina/Admin en el control individual: ahi no se filtra por zona,
         si no el pop-up salia vacio. [08-sep-2026] */
      if(area!=='Personal' && e.zona!==area)return;
      var d=(e.dias||{})[dayKey];
      if(!d)return;
      var pr=_progEnHora(d,h), rl=_realEnHora(d,h);
      var etq=e.nombre+(esCiudad?'  \u00b7  '+p:'');
      if(pr)prog.push({n:etq,t:pr,ok:!!rl});
      if(rl)real.push({n:etq,t:rl,prog:!!pr});   /* prog=false -> trabajo sin estar programado */
    });
  });
  /* conteos oficiales del heatmap (presupuesto del HT y real del pipeline) */
  var sem=DAY_SEM[dayKey]||'S1',dow=String(DAY_DOW[dayKey]);
  var pv=0,rv=0;
  pdvs.forEach(function(p){
    pv+=((PRESUP[p]||{})[sem]||{})[dow]?.[area]?.[String(h)]??0;
    rv+=((REAL_BY_DAY[dayKey]||{})[p]||{})[area]?.[String(h)]??0;
  });
  prog.sort(function(a,b){return a.t<b.t?-1:1;});
  real.sort(function(a,b){return a.t<b.t?-1:1;});

  var prev=document.getElementById('modal-h-overlay');if(prev)prev.remove();
  var ov=document.createElement('div');ov.id='modal-h-overlay';
  ov.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;';
  var card=document.createElement('div');
  card.style.cssText='background:#0f1117;border:1px solid #333;border-radius:10px;min-width:420px;max-width:92vw;max-height:86vh;overflow:auto;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.6);font-family:DM Sans,sans-serif;';
  var titulo=(HL[h]||h+'h')+'  \u00b7  '+area+'  \u00b7  '+(DAY_LABEL[dayKey]||dayKey);
  var html='<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #262a38">';
  html+='<div><div style="font-weight:600;font-size:14px">'+titulo+'</div>';
  html+='<div style="color:var(--muted);font-size:11px;margin-top:2px">'+(esCiudad?'Toda la ciudad':pdv)+'</div></div>';
  html+='<div id="modal-h-close" style="cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:0 4px;user-select:none">&times;</div></div>';
  html+='<div style="padding:14px 18px">';
  html+='<div style="display:flex;gap:16px;margin-bottom:12px;font-family:JetBrains Mono,monospace;font-size:13px">';
  html+='<div><span style="color:var(--muted)">Programadas:</span> <span style="font-weight:700">'+pv+'</span></div>';
  html+='<div><span style="color:var(--muted)">Reales:</span> <span style="font-weight:700;color:var(--green)">'+rv+'</span></div>';
  var _dv=rv-pv;
  html+='<div><span style="color:var(--muted)">Dif:</span> <span style="font-weight:700;color:'+(_dv>0?'var(--over)':_dv<0?'var(--under)':'var(--green)')+'">'+(_dv>0?'+':'')+_dv+'</span></div>';
  html+='</div>';
  var C_EXTRA='#f59e0b';   /* naranja: trabajo sin estar programado */
  var C_FALTO='#60a5fa';   /* azul claro: estaba programado y no estuvo */
  function bloque(tit,color,items,vacio){
    var s='<div style="margin-top:10px"><div style="color:'+color+';font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">'+tit+' ('+items.length+')</div>';
    if(!items.length){s+='<div style="color:var(--muted2);font-size:12px;font-style:italic">'+vacio+'</div>';}
    items.forEach(function(it){
      /* reales: quien NO tenia turno a esa hora va en naranja.
         programadas: quien NO estuvo va en azul claro (se queda en esta lista,
         porque su turno existia â€” solo que no lo cubrio). */
      var col=(it.prog===false)?C_EXTRA:((it.ok===false)?C_FALTO:color);
      var suf=(it.prog===false)?'  <span style="font-size:10px;color:'+C_EXTRA+'">sin turno</span>'
              :((it.ok===false)?'  <span style="font-size:10px;color:'+C_FALTO+'">no estuvo</span>':'');
      s+='<div style="display:flex;justify-content:space-between;gap:14px;padding:3px 0;border-bottom:1px solid #1b1e29">';
      s+='<span style="font-size:12.5px;color:'+col+'">'+it.n+suf+'</span>';
      /* la hora sigue el mismo color que el nombre: gris programado, verde real, naranja sin turno */
      s+='<span style="font-family:JetBrains Mono,monospace;font-size:11.5px;color:'+col+';opacity:.85">'+it.t+'</span></div>';
    });
    return s+'</div>';
  }
  html+=bloque('Programadas','var(--muted)',prog,'Nadie con turno a esta hora');
  html+=bloque('Estuvieron realmente','var(--green)',real,'Nadie marc\u00f3 presencia en esta hora');
  if(rv>real.length){
    html+='<div style="margin-top:10px;font-size:11px;color:var(--muted2);font-style:italic">+'+(rv-real.length)+' persona(s) cuentan en el heatmap pero no aparecen arriba (admins o apoyos sin control individual).</div>';
  }
  html+='<div style="margin-top:12px;padding-top:10px;border-top:1px solid #262a38;font-size:10.5px;color:var(--muted2);font-style:italic">';
  html+='<span style="color:'+C_FALTO+'">Azul</span> = estaba programado y no estuvo &nbsp;\u00b7&nbsp; <span style="color:'+C_EXTRA+'">Naranja</span> = trabaj\u00f3 sin estar programado.<br>';
  html+='Cuenta en la hora quien entra a m\u00e1s tardar :30 y sale :31 o despu\u00e9s (al menos media hora presente).</div>';
  html+='</div>';
  card.innerHTML=html;ov.appendChild(card);document.body.appendChild(ov);
  function cerrar(){var o=document.getElementById('modal-h-overlay');if(o)o.remove();document.removeEventListener('keydown',esc);}
  function esc(ev){if(ev.key==='Escape'||ev.keyCode===27)cerrar();}
  ov.addEventListener('click',function(ev){if(ev.target===ov)cerrar();});
  var cb=document.getElementById('modal-h-close');if(cb)cb.addEventListener('click',cerrar);
  document.addEventListener('keydown',esc);
}
