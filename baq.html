  rc+='<div style="width:'+Math.min(cityCost/maxCityCost*100,100)+'%;height:100%;background:var(--green);border-radius:2px"></div>';
  var dotCityP=Math.min(cityProg/maxCityCost*100,100);
  rc+='<div style="position:absolute;left:calc('+dotCityP+'% - 3px);top:-4px;width:8px;height:8px;background:#fff;border-radius:50%;z-index:3;box-shadow:0 0 3px rgba(0,0,0,.5)"></div>';
  rc+='</div>';
  rc+='<span style="font-size:11px;font-family:JetBrains Mono,monospace;min-width:90px;text-align:right"><span style="color:var(--green);font-weight:600">'+Math.round(cityCost)+'</span><span style="color:var(--muted2)"> / '+Math.round(cityProg)+'</span></span>';
  rc+='</div>';
  rc+='</div></div>';
  sec.innerHTML='<div class="track-title">Control por PDV</div>'+rc;

  // === PDV TABLE - simplified: just PDV | P | R(cost) | Î” + green bar ===
  // Sort by cost difference descending (biggest overspend first)
  pdvStats.sort(function(a,b){return (b.costHrs-b.totProg)-(a.costHrs-a.totProg);});
  
  var panel=document.createElement('div');panel.className='panel';
  
  // Legend above table
  var t='<div style="padding:8px 16px 4px;font-size:9px;color:var(--muted2);display:flex;align-items:center;gap:12px">';
  t+='<span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:4px;background:var(--green);border-radius:2px;display:inline-block"></span> Horas a pagar</span>';
  t+='<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;background:#fff;border-radius:50%;display:inline-block;box-shadow:0 0 2px rgba(0,0,0,.4)"></span> Programadas</span>';
  t+='<span style="color:var(--over)">+Extra</span>';
  t+='<span style="color:var(--under)">\u2212Ocio TC</span>';
  t+='</div>';
  
  t+='<table class="sched" style="font-size:12px"><thead><tr>';
  t+='<th style="text-align:left;min-width:140px;font-size:12px"></th>';
  t+='<th style="font-size:10px;color:var(--muted2);text-align:center;min-width:50px">P</th>';
  t+='<th style="font-size:10px;color:var(--green);text-align:center;min-width:50px">R</th>';
  t+='<th style="font-size:10px;color:var(--muted2);text-align:center;min-width:40px">\u0394</th>';
  t+='</tr></thead><tbody>';

  var maxCost=Math.max.apply(null,pdvStats.map(function(p){return Math.max(p.costHrs,p.totProg);}).concat([1]));
  
  pdvStats.forEach(function(ps){
    var pdvDiff=ps.costHrs-ps.totProg;
    var pdvColor=pdvDiff>10?'var(--over)':pdvDiff<-10?'var(--under)':'var(--green)';
    
    t+='<tr>';
    t+='<td style="text-align:left;font-family:DM Sans,sans-serif;font-weight:600;font-size:12px;padding:4px 6px;color:var(--text);border-bottom:none;cursor:pointer" onclick="curPDV=\''+ps.pdv+'\';render();">'+ps.pdv+'</td>';
    t+='<td style="padding:3px 6px;opacity:.5;border-bottom:none;text-align:center">'+Math.round(ps.totProg)+'</td>';
    t+='<td style="padding:3px 6px;font-weight:700;color:'+pdvColor+';border-bottom:none;text-align:center">'+Math.round(ps.costHrs)+'</td>';
    t+='<td style="padding:3px 6px;font-weight:600;color:'+pdvColor+';border-bottom:none;font-size:11px;text-align:center">'+(pdvDiff>0?'+':'')+Math.round(pdvDiff)+'</td>';
    t+='</tr>';
    
    // Green bar with conditional excess tail
    t+='<tr><td colspan="4" style="padding:2px 6px 6px 6px;border-bottom:1px solid var(--surface2)">';
    t+='<div style="display:flex;align-items:center;gap:6px">';
    t+='<div style="flex:1;height:4px;background:var(--surface2);border-radius:2px;position:relative;overflow:visible">';
    var barW=Math.min(ps.costHrs/maxCost*100,100);
    var dotP=Math.min(ps.totProg/maxCost*100,100);
    var costRatio=ps.totProg>0?ps.costHrs/ps.totProg:1;
    var tailColor=costRatio<1.05?'var(--green)':costRatio<1.10?'#f59e0b':'#dc2626';
    // Green base up to dot
    t+='<div style="position:absolute;left:0;width:'+dotP+'%;height:100%;background:var(--green);border-radius:2px 0 0 2px;z-index:1"></div>';
    // Excess tail from dot to end of bar
    if(barW>dotP){
      t+='<div style="position:absolute;left:'+dotP+'%;width:'+(barW-dotP)+'%;height:100%;background:'+tailColor+';border-radius:0 2px 2px 0;z-index:1"></div>';
    }
    // White dot
    t+='<div style="position:absolute;left:calc('+dotP+'% - 3px);top:-4px;width:8px;height:8px;background:#fff;border-radius:50%;z-index:3;box-shadow:0 0 3px rgba(0,0,0,.5)"></div>';
    t+='</div>';
    t+='<span style="font-size:9px;font-family:JetBrains Mono,monospace;color:var(--over);min-width:35px;text-align:right">+'+(Math.round(ps.excess*10)/10)+'</span>';
    t+='<span style="font-size:9px;font-family:JetBrains Mono,monospace;color:var(--under);min-width:35px;text-align:right">-'+(Math.round(ps.idleTc*10)/10)+'</span>';
    t+='</div></td></tr>';
  });
  
  t+='</tbody></table>';
  var tw=document.createElement('div');tw.style.cssText='overflow-x:auto';tw.innerHTML=t;
  panel.appendChild(tw);sec.appendChild(panel);ct.appendChild(sec);
}

    var tb='<tbody>';
    FRANJAS.forEach(function(f){f.hrs.forEach(function(h,fi){
      var pv=0,rv=0;

  });
  ct.appendChild(grid);
  
  // Also show the control individual section
  var track=STAFF_TRACK[pdv];

}

function renderCatorcenaCity(ct){

  // Aggregate grid across all PDVs and all days
  var grid=document.createElement('div');grid.className='grids';

      var chip=(!pv&&!rv)?'<span class="chip cok">\u2014</span>':dv>0?'<span class="chip cov">+'+dv+'</span>':dv<0?'<span class="chip cun">'+dv+'</span>':'<span class="chip cok">\u2014</span>';
      var cells=fr+'<td style="color:var(--muted);font-size:11px">'+HL[h]+'</td><td style="opacity:'+(pv===0?.25:1)+';color:var(--muted)">'+pv+'</td>';
      cells+='<td style="opacity:'+(rv===0?.25:1)+';font-weight:600;color:var(--green)">'+rv+'</td><td>'+chip+'</td>';
      tb+='<tr'+cls+'>'+cells+'</tr>';
    });});
    tb+='</tbody>';var t=document.createElement('table');t.className='sched';t.innerHTML=hd+tb;p_.appendChild(t);grid.appendChild(p_);
  });

  var tTitle=document.createElement('div');tTitle.className='track-title';tTitle.textContent='Control por PDV';sec.appendChild(tTitle);
  var panel=document.createElement('div');panel.className='panel';
  
  var dks=activeDays;
  var dayLbl2=[];dks.forEach(function(d){dayLbl2.push(DAY_LABEL[d]||d);});
  
  var t='<table class="sched" style="font-size:12px"><thead><tr>';
  t+='<th style="text-align:left;min-width:140px;font-size:12px"></th>';
  dks.forEach(function(dk,i){t+='<th colspan="2" style="min-width:50px;font-size:11px;border-bottom:2px solid var(--border);'+bdrR+'">'+dayLbl2[i]+'</th>';});
  t+='<th colspan="3" style="font-size:11px;border-bottom:2px solid var(--border);border-left:2px solid var(--border);text-align:center;padding:2px 4px">Catorcena</th>';
  t+='</tr><tr><th></th>';
  dks.forEach(function(){t+='<th style="font-size:10px;color:var(--muted2)">P</th><th style="font-size:10px;color:var(--green);'+bdrR+'">R</th>';});
  t+='<th style="font-size:10px;color:var(--muted2);padding:2px 1px;text-align:center;border-left:2px solid var(--border)">P</th><th style="font-size:10px;color:var(--green);padding:2px 1px;text-align:center">R</th><th style="font-size:10px;color:var(--muted2);padding:2px 1px;text-align:center">\u0394</th>';
  t+='</tr></thead><tbody>';
  
  var pdvStats2=PDVS.map(function(pdv){

      totMeta+=e.meta;totProg+=e.acum_prog;totReal+=e.acum_real;
      dks.forEach(function(dk){var d=e.dias[dk]||{prog:0,real:0};dayT[dk].p+=d.prog;dayT[dk].r+=d.real;});

    return {pdv:pdv,totMeta:totMeta,totProg:totProg,totReal:totReal,dayT:dayT};

    t+='</tr>';
    var pR=totMeta>0?Math.min(totReal/totMeta*100,100):0;
    var pE=totMeta>0?Math.min(totProg/totMeta*100,100):0;
    var bC=pdvDiff>2?'var(--over)':pdvDiff<-2?'var(--under)':'var(--green)';
    var cols=3+dks.length*2;
    t+='<tr><td colspan="'+cols+'" style="padding:0 6px 6px 6px;border-bottom:1px solid var(--surface2)">';

    t+='</div></div></td></tr>';
  });
  t+='</tbody></table>';
  var tw=document.createElement('div');tw.style.cssText='overflow-x:auto';tw.innerHTML=t;
  panel.appendChild(tw);sec.appendChild(panel);ct.appendChild(sec);
}
