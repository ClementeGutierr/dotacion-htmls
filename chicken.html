   se muestran horas de mas y ocio TOTALES (con TC/MT debajo); al cierre el MT

}

/* VACANTES (26-ago-2026, Clemente): un placeholder sin persona tiene P pero
   R=0, asi que genera "ocio" que NO existe y tapa las horas extra reales del
   punto (Manila: +198h reales se veian como -27.8h). Se excluyen de TODOS los
   agregados: prog, real, ocio y costo. Se reconocen por el doc que arma
   build_schedules ('_1','_2'...) o por el nombre del placeholder.
   OJO: tiene que vivir en el scope GLOBAL â€” quedo dentro de la vista de PDV y
   las vistas de ciudad reventaban con "esVac is not defined". */
function esVac(e){
  var d=String((e&&e.doc)||'');
  if(!d || d.charAt(0)==='_') return true;
  if(d==='NO APLICA'||d==='PENDIENTE'||d.indexOf('VACANTE')===0) return true;
  var n=String((e&&e.nombre)||'').toLowerCase();
  return n.indexOf('vacante')>=0||n.indexOf('por llenar')>=0||n.indexOf('no aplica')>=0;
}

/* GRAFICAS (09-oct-2026, Clemente): ultimos meses + mes en curso, en el Resumen
   Ciudad y en el Resumen PDV. Hora extra = % sobre lo programado (meses cerrados:
   lo del PDF de cierre; mes en curso: PROYECTADA a fin de mes). Nivel de servicio
   = % de bloques bien cubiertos (mes en curso: al dia de hoy). */
function _hayHist(){return typeof HIST!=='undefined'&&HIST&&(HIST.meses||[]).length>0;}
function _proyHe(track){var h=0,pr=0;(track||[]).forEach(function(e){
  if(esVac(e)||e.zona==='Admin'||e.admin_solo_r)return;
  var tx=(e.tope_extra!=null)?e.tope_extra:e.meta;var px=(e.proy!=null)?e.proy:e.acum_real;
  pr+=(e.proy!=null)?(e.acum_prog+(e.proy_fut||0)):(e.meta||e.acum_prog);
  if(tx>0&&px>tx)h+=px-tx;});return [h,pr];}
function _serie(clave){
  /* clave: '__C__' ciudad o nombre del PDV -> [{lbl,he,sv,act}] */
  var out=[];var pc=function(v){return (v&&v[1]>0)?v[0]/v[1]*100:null;};
  HIST.meses.forEach(function(m){var d=HIST.datos[m]||{};var s=clave==='__C__'?d.ciudad:(d.pdvs||{})[clave];
    out.push({lbl:HIST.lbl[m],he:(s&&s.he)?s.he[0]:null,heP:s?pc(s.he):null,sv:s?pc(s.srv):null,act:false});});
  var SV=(typeof SERVICIO!=='undefined'&&SERVICIO)?SERVICIO:null;var he,heP,sv;
  if(clave==='__C__'){var ch=0,cp=0;PDVS_CI.forEach(function(p){if(esApoyo(p))return;var x=_proyHe(STAFF_TRACK[p]);ch+=x[0];cp+=x[1];});he=ch;heP=cp>0?ch/cp*100:null;sv=SV?pc(SV.ciudad):null;}
  else{var x=_proyHe(STAFF_TRACK[clave]);he=x[0];heP=x[1]>0?x[0]/x[1]*100:null;sv=SV?pc((SV.pdvs||{})[clave]):null;}
  out.push({lbl:(HIST.actual_lbl||'Actual'),he:he,heP:heP,sv:sv,act:true});
  return out;
}
function _svgLinea(serie,campo,titulo,sub,color,colV,yMax,fmt){
  var W=320,H=120,L=26,R=28,T=22,B=24;
  var pts=serie.filter(function(p){return p[campo]!==null;});
  if(pts.length<2)return '';
  var mx=yMax||Math.max.apply(null,pts.map(function(p){return p[campo];}).concat([1]))*1.35;
  var n=serie.length;var X=function(i){return L+(n===1?0:i*(W-L-R)/(n-1));};var Y=function(v){return T+(H-T-B)*(1-v/mx);};
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  s+='<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="var(--border)" stroke-width="1"/>';
  var prev=null;
  serie.forEach(function(p,i){var v=p[campo];
    if(v!==null&&prev){s+='<line x1="'+X(prev.i)+'" y1="'+Y(prev.v)+'" x2="'+X(i)+'" y2="'+Y(v)+'" stroke="'+color+'" stroke-width="2"'+(p.act?' stroke-dasharray="4 3"':'')+'/>';}
    if(v!==null)prev={i:i,v:v};});
  serie.forEach(function(p,i){var v=p[campo];var x=X(i);
    s+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="DM Sans,sans-serif">'+p.lbl+(p.act?'*':'')+'</text>';
    if(v===null)return;
    s+='<circle cx="'+x+'" cy="'+Y(v)+'" r="3.5" fill="'+(p.act?'var(--surface)':color)+'" stroke="'+color+'" stroke-width="2"/>';
    s+='<text x="'+x+'" y="'+(Y(v)-8)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+colV(v,p)+'" font-family="JetBrains Mono,monospace">'+(fmt?fmt(v):(Math.round(v*10)/10).toFixed(1).replace('.',',')+'%')+'</text>';});
  s+='</svg>';
  return '<div style="background:var(--surface2);border-radius:8px;padding:10px 12px"><div style="font-size:11px;color:'+SUBC+';letter-spacing:.05em;text-transform:uppercase">'+titulo+'</div><div style="font-size:10.5px;color:'+SUBC+';margin-bottom:2px">'+sub+'</div>'+s+'</div>';
}
function _graficas(clave){
  if(!_hayHist())return '';

  var colHe=function(v,p){var x=p?p.heP:null;return x===null?'var(--red)':x<=2?'var(--green)':x<=5?'#f59e0b':'var(--red)';};
  var colSv=function(x){return x>=75?'var(--green)':x>=60?'#f59e0b':'var(--red)';};
  var fH=function(v){return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'h';};
  var g1=_svgLinea(se,'he','Hora extra','horas del mes','#ef4444',colHe,null,fH);

}

/* ============================================================
   Modal PERSONAS POR HORA (16-ago-2026, Clemente)
   Click en una fila del heatmap -> lista de quienes estaban
   PROGRAMADOS (gris) y quienes estuvieron REALMENTE (verde).
   Usa STAFF_TRACK: dias[dk].turnos (programado) y .turnos_reales.
   Misma regla del heatmap: cuenta la hora h quien entra <= h:30
   y sale >= h:31 (presente al menos media hora).
   ============================================================ */
function _rangoTurno(t){
  if(typeof t==='string'&&t.indexOf('-')>=0){
    var p=t.split('-'),a=parseInt(p[0],10),b=parseInt(p[1],10);
    if(!isNaN(a)&&!isNaN(b))return [a,b];
  }else if(Array.isArray(t)&&t.length===2){
    var a2=parseInt(t[0],10),b2=parseInt(t[1],10);
    if(!isNaN(a2)&&!isNaN(b2))return [a2,b2];
  }
  return null;
}
function _pad2(n){return n<10?'0'+n:''+n;}
function _progEnHora(d,h){
  var ts=(d&&d.turnos)||[];
  for(var i=0;i<ts.length;i++){
    var r=_rangoTurno(ts[i]);
    if(r&&h>=r[0]&&h<r[1]) return _pad2(r[0])+':00 \u2192 '+_pad2(r[1])+':00';
  }
  return null;
}
function _realEnHora(d,h){
  var ts=(d&&d.turnos_reales)||[];
  for(var i=0;i<ts.length;i++){
    var m=String(ts[i]).match(/(\d{1,2}):(\d{2})\D+(\d{1,2}):(\d{2})/);
    if(!m)continue;
    var e=(+m[1])*60+(+m[2]), s=(+m[3])*60+(+m[4]);
    if(s<e)s+=1440;
    if(e<=h*60+30&&s>=h*60+31) return _pad2(+m[1])+':'+m[2]+' \u2192 '+_pad2(+m[3])+':'+m[4];
  }
  return null;
}
function mostrarModalHora(pdv,area,h,dayKey){
  if(typeof STAFF_TRACK==='undefined')return;
  var esCiudad=(pdv==='__CIUDAD__');
  var pdvs=esCiudad?PDVS.slice():[pdv];
  var prog=[],real=[];
  pdvs.forEach(function(p){
    (STAFF_TRACK[p]||[]).forEach(function(e){
      /* Chicken (HOJA ESTANDAR) presupuesta todo en 'Personal' y su gente esta en
         Salon/Cocina/Admin en el control individual: ahi no se filtra por zona,
         si no el pop-up salia vacio. [08-sep-2026] */
      if(area!=='Personal' && e.zona!==area)return;
      var d=(e.dias||{})[dayKey];
      if(!d)return;
      var pr=_progEnHora(d,h), rl=_realEnHora(d,h);
      var etq=e.nombre+(esCiudad?'  \u00b7  '+p:'');
      if(pr)prog.push({n:etq,t:pr,ok:!!rl});
      if(rl)real.push({n:etq,t:rl,prog:!!pr});   /* prog=false -> trabajo sin estar programado */
    });
  });
  /* conteos oficiales del heatmap (presupuesto del HT y real del pipeline) */
  var sem=DAY_SEM[dayKey]||'S1',dow=String(DAY_DOW[dayKey]);
  var pv=0,rv=0;
  pdvs.forEach(function(p){
    pv+=((PRESUP[p]||{})[sem]||{})[dow]?.[area]?.[String(h)]??0;
    rv+=((REAL_BY_DAY[dayKey]||{})[p]||{})[area]?.[String(h)]??0;
  });
  prog.sort(function(a,b){return a.t<b.t?-1:1;});
  real.sort(function(a,b){return a.t<b.t?-1:1;});

  var prev=document.getElementById('modal-h-overlay');if(prev)prev.remove();
  var ov=document.createElement('div');ov.id='modal-h-overlay';
  ov.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;';
  var card=document.createElement('div');
  card.style.cssText='background:#0f1117;border:1px solid #333;border-radius:10px;min-width:420px;max-width:92vw;max-height:86vh;overflow:auto;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.6);font-family:DM Sans,sans-serif;';
  var titulo=(HL[h]||h+'h')+'  \u00b7  '+area+'  \u00b7  '+(DAY_LABEL[dayKey]||dayKey);
  var html='<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #262a38">';
  html+='<div><div style="font-weight:600;font-size:14px">'+titulo+'</div>';
  html+='<div style="color:var(--muted);font-size:11px;margin-top:2px">'+(esCiudad?'Toda la ciudad':pdv)+'</div></div>';
  html+='<div id="modal-h-close" style="cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:0 4px;user-select:none">&times;</div></div>';
  html+='<div style="padding:14px 18px">';
  html+='<div style="display:flex;gap:16px;margin-bottom:12px;font-family:JetBrains Mono,monospace;font-size:13px">';
  html+='<div><span style="color:var(--muted)">Programadas:</span> <span style="font-weight:700">'+pv+'</span></div>';
  html+='<div><span style="color:var(--muted)">Reales:</span> <span style="font-weight:700;color:var(--green)">'+rv+'</span></div>';
  var _dv=rv-pv;
  html+='<div><span style="color:var(--muted)">Dif:</span> <span style="font-weight:700;color:'+(_dv>0?'var(--over)':_dv<0?'var(--under)':'var(--green)')+'">'+(_dv>0?'+':'')+_dv+'</span></div>';
  html+='</div>';
  var C_EXTRA='#f59e0b';   /* naranja: trabajo sin estar programado */
  var C_FALTO='#60a5fa';   /* azul claro: estaba programado y no estuvo */
  function bloque(tit,color,items,vacio){
    var s='<div style="margin-top:10px"><div style="color:'+color+';font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">'+tit+' ('+items.length+')</div>';
    if(!items.length){s+='<div style="color:var(--muted2);font-size:12px;font-style:italic">'+vacio+'</div>';}
    items.forEach(function(it){
      /* reales: quien NO tenia turno a esa hora va en naranja.
         programadas: quien NO estuvo va en azul claro (se queda en esta lista,
         porque su turno existia â€” solo que no lo cubrio). */
      var col=(it.prog===false)?C_EXTRA:((it.ok===false)?C_FALTO:color);
      var suf=(it.prog===false)?'  <span style="font-size:10px;color:'+C_EXTRA+'">sin turno</span>'
              :((it.ok===false)?'  <span style="font-size:10px;color:'+C_FALTO+'">no estuvo</span>':'');
      s+='<div style="display:flex;justify-content:space-between;gap:14px;padding:3px 0;border-bottom:1px solid #1b1e29">';
      s+='<span style="font-size:12.5px;color:'+col+'">'+it.n+suf+'</span>';
      /* la hora sigue el mismo color que el nombre: gris programado, verde real, naranja sin turno */
      s+='<span style="font-family:JetBrains Mono,monospace;font-size:11.5px;color:'+col+';opacity:.85">'+it.t+'</span></div>';
    });
    return s+'</div>';
  }
  html+=bloque('Programadas','var(--muted)',prog,'Nadie con turno a esta hora');

  if(rv>real.length){
    html+='<div style="margin-top:10px;font-size:11px;color:var(--muted2);font-style:italic">+'+(rv-real.length)+' persona(s) cuentan en el heatmap pero no aparecen arriba (admins o apoyos sin control individual).</div>';
  }
  html+='<div style="margin-top:12px;padding-top:10px;border-top:1px solid #262a38;font-size:10.5px;color:var(--muted2);font-style:italic">';
  html+='<span style="color:'+C_FALTO+'">Azul</span> = estaba programado y no estuvo &nbsp;\u00b7&nbsp; <span style="color:'+C_EXTRA+'">Naranja</span> = trabaj\u00f3 sin estar programado.<br>';
  html+='Cuenta en la hora quien entra a m\u00e1s tardar :30 y sale :31 o despu\u00e9s (al menos media hora presente).</div>';
  html+='</div>';
  card.innerHTML=html;ov.appendChild(card);document.body.appendChild(ov);
  function cerrar(){var o=document.getElementById('modal-h-overlay');if(o)o.remove();document.removeEventListener('keydown',esc);}
  function esc(ev){if(ev.key==='Escape'||ev.keyCode===27)cerrar();}
  ov.addEventListener('click',function(ev){if(ev.target===ov)cerrar();});
  var cb=document.getElementById('modal-h-close');if(cb)cb.addEventListener('click',cerrar);
  document.addEventListener('keydown',esc);
}

</script>
</body>
</html>
