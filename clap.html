<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0e14;--surface:#151821;--surface2:#1c1f2b;--border:#262a38;--text:#e2e8f0;--muted:#6b7588;--muted2:#4a5068;--over:#c2410c;--under:#818cf8;--green:#22c55e;--red:#ef4444;--yellow:#facc15;--blue:#3b82f6;--salon:#f59e0b;--cocina:#ef4444;--barra:#3b82f6;--admin:#10b981}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding:12px 16px}
.header{padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:12px}
.header h1{font-size:18px;font-weight:700}.header .sub{font-size:12px;color:var(--muted)}
.pdv-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pdv-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.pdv-btn:hover{border-color:var(--muted)}.pdv-btn.active{background:var(--green);color:#000;border-color:var(--green);font-weight:700}
.day-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.day-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.day-btn:hover{border-color:var(--muted)}.day-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.grids{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;overflow:hidden}
.panel-hdr{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-weight:700;font-size:14px}
.panel-dot{width:8px;height:8px;border-radius:50%}
table.sched{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:12px}
table.sched th{color:var(--muted);font-weight:500;padding:3px 4px;font-size:11px}
table.sched td{padding:3px 5px;text-align:center}
.frs{writing-mode:vertical-lr;transform:rotate(180deg);font-size:9px;color:var(--muted2);letter-spacing:1px;font-weight:600}
.row-ov{background:rgba(194,65,12,.12)}.row-un{background:rgba(129,140,248,.08)}
.chip{font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px}
.chip.cov{color:var(--over)}.chip.cun{color:var(--under)}.chip.cok{color:var(--muted2)}
.sum-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.scard{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:130px;flex:1}
.scard-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.scard-val{font-size:22px;font-weight:700;margin-top:2px}.scard-sub{font-size:11px;color:var(--muted);margin-top:2px}
.inc-section,.jorn-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:16px}
.inc-title{font-size:14px;font-weight:700;color:var(--yellow);margin-bottom:8px}
.jorn-title{font-size:14px;font-weight:700;color:var(--red);margin-bottom:8px}
.inc-table{width:100%;border-collapse:collapse;font-size:13px}
.inc-table th{text-align:left;color:var(--muted);font-weight:500;padding:4px 8px;border-bottom:1px solid var(--border)}
.inc-table td{padding:4px 8px}
.track-section{margin-top:20px;border-top:2px solid var(--border);padding-top:16px}
.track-title{font-size:16px;font-weight:700;margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:4px}
.ldot{width:10px;height:10px;border-radius:2px;display:inline-block}
.upd-badge{position:fixed;top:8px;right:12px;background:rgba(0,0,0,0.55);color:#9fb4d8;padding:4px 10px;border-radius:6px;font-size:11px;z-index:9999;pointer-events:none}</style>

var curPDV='__CIUDAD__',curDay=DAYS.length?DAYS[DAYS.length-1]:'';

function render(){

  PDVS.forEach(function(p){var b=document.createElement('button');b.className='pdv-btn'+(p===curPDV?' active':'');b.textContent=p;b.onclick=function(){curPDV=p;render();};pb.appendChild(b);});

  var catBtn=document.createElement('button');catBtn.className='day-btn'+(curDay==='__CAT__'?' active':'');catBtn.textContent='Mes';catBtn.style.fontWeight='600';catBtn.onclick=function(){curDay='__CAT__';render();};db.appendChild(catBtn);
  var ct=document.getElementById('content');ct.innerHTML='';

  if(curDay==='__CAT__'){renderCatorcena(ct,curPDV);return;}
  
  var pdv=curPDV;

    var tb='<tbody>';
    FRANJAS.forEach(function(f){f.hrs.forEach(function(h,fi){
      var pv=((PRESUP[pdv]||{})[sem]||{})[dow]?.[area]?.[String(h)]??0;
      var rv=hr?(realDay[area]?.[String(h)]??0):null;
      var dv=rv!==null?rv-pv:null;
      var cls=pv>0&&dv!==null?(dv>0?' class="row-ov"':dv<0?' class="row-un"':''):'';
      var fr=fi===0?'<td rowspan="'+f.hrs.length+'"><span class="frs">'+f.lbl+'</span></td>':'';
      var cells=fr+'<td style="color:var(--muted);font-size:11px">'+HL[h]+'</td><td style="opacity:'+(pv===0?.25:1)+';color:var(--muted)">'+pv+'</td>';
      if(hr){var chip=(!pv&&!rv)?'<span class="chip cok">\u2014</span>':dv>0?'<span class="chip cov">+'+dv+'</span>':dv<0?'<span class="chip cun">'+dv+'</span>':'<span class="chip cok">\u2014</span>';
        cells+='<td style="opacity:'+(rv===0?.25:1)+';font-weight:600;color:var(--green)">'+rv+'</td><td>'+chip+'</td>';}
      tb+='<tr'+cls+'>'+cells+'</tr>';
    });});
    tb+='</tbody>';var t=document.createElement('table');t.className='sched';t.innerHTML=hd+tb;p_.appendChild(t);grid.appendChild(p_);
  });
  ct.appendChild(grid);

  if(hr){
    var idata=(INC_BY_DAY[day]||{})[pdv]||[];
    if(idata.length){var isec=document.createElement('div');isec.className='inc-section';
      var ih='<div class="inc-title">\u26a0 Marcaciones incompletas ('+idata.length+')</div><table class="inc-table"><thead><tr><th>Nombre</th><th>\u00c1rea</th><th>Tipo</th><th>Hora</th></tr></thead><tbody>';
      idata.forEach(function(emp){emp.marcaciones.forEach(function(m){ih+='<tr><td>'+emp.emp+'</td><td><span style="color:'+(AC[emp.area]||'#888')+'">\u25cf '+emp.area+'</span></td><td>'+m.tipo+'</td><td style="font-weight:600">'+m.hora+'</td></tr>';});});
      ih+='</tbody></table>';isec.innerHTML=ih;ct.appendChild(isec);}
  }

  // Control Individual
  var track=STAFF_TRACK[pdv];
  if(track&&track.length){
    var sec=document.createElement('div');sec.className='track-section';
    
    // PDV Summary - same format as individual tracking
    var dks=Object.keys(track[0].dias);
    var totMeta=0,totProg=0,totReal=0;
    var dayTotals={};
    dks.forEach(function(dk){dayTotals[dk]={prog:0,real:0};});
    track.forEach(function(e){
      totMeta+=e.meta;totProg+=e.acum_prog;totReal+=e.acum_real;
      dks.forEach(function(dk){
        var d=e.dias[dk]||{prog:0,real:0};
        dayTotals[dk].prog+=d.prog;
        dayTotals[dk].real+=d.real;
      });
    });
    
    var pdvPanel=document.createElement('div');pdvPanel.className='panel';pdvPanel.style.marginBottom='16px';
    pdvPanel.innerHTML='<div class="panel-hdr">Resumen PDV <span style="color:var(--muted);font-weight:400;font-size:12px">('+track.length+' personas)</span></div>';
    
    // Calculate 3-bar metrics
    // Admins tienen salario fijo: NO se cuentan en extras/ocio (pero sÃ­ en costo)
    var totalExcess=0, totalIdle=0, costHrs=0, countTc=0;
    track.forEach(function(emp){
      var isAdmin=emp.zona==='Admin';
      if(!isAdmin && emp.acum_real>emp.acum_prog) totalExcess+=Math.round((emp.acum_real-emp.acum_prog)*10)/10;
      if(emp.tipo==='FULL'){
        countTc++;
        if(!isAdmin && emp.acum_prog>emp.acum_real) totalIdle+=Math.round((emp.acum_prog-emp.acum_real)*10)/10;
        costHrs+=Math.max(emp.acum_prog,emp.acum_real);
      } else {
        costHrs+=emp.acum_real;
      }
    });
    // City averages â€” tambiÃ©n excluye admins
    var cityEx=0,cityId=0,cityN=0;
    PDVS.forEach(function(p){
      var tr=STAFF_TRACK[p]||[];if(tr.length===0)return;cityN++;
      tr.forEach(function(e){
        var isAdmin=e.zona==='Admin';
        if(!isAdmin && e.acum_real>e.acum_prog) cityEx+=Math.round((e.acum_real-e.acum_prog)*10)/10;
        if(!isAdmin && e.tipo==='FULL'&&e.acum_prog>e.acum_real) cityId+=Math.round((e.acum_prog-e.acum_real)*10)/10;
      });
    });
    cityEx=cityN>0?cityEx/cityN:0; cityId=cityN>0?cityId/cityN:0;
    var maxBar=Math.max(totalExcess,totalIdle,cityEx,cityId,1);
    var maxCost=Math.max(costHrs,totProg,1);
    
    var pt='<div style="padding:12px 16px;display:flex;flex-direction:column;gap:10px">';
    // Red bar (excess): P=city avg, R=PDV excess
    pt+='<div style="display:flex;align-items:center;gap:8px">';
    pt+='<span style="font-size:10px;color:var(--muted2);min-width:55px">Extra</span>';
    pt+='<div style="flex:1;height:5px;background:var(--surface2);border-radius:2px;position:relative;overflow:visible">';
    pt+='<div style="width:'+Math.min(totalExcess/maxBar*100,100)+'%;height:100%;background:var(--over);border-radius:2px"></div>';
    pt+='<div style="position:absolute;left:calc('+Math.min(cityEx/maxBar*100,100)+'% - 3px);top:-4px;width:8px;height:8px;background:#fff;border-radius:50%;z-index:3;box-shadow:0 0 3px rgba(0,0,0,.5)"></div>';
    pt+='</div>';
    pt+='<span style="font-size:10px;font-family:JetBrains Mono,monospace;min-width:100px;text-align:right"><span style="color:var(--muted2)">'+Math.round(cityEx*10)/10+'</span> <span style="color:var(--over);font-weight:600">+'+Math.round(totalExcess*10)/10+'h</span></span>';
    pt+='</div>';
    // Blue bar (idle TC): P=city avg, R=PDV idle
    pt+='<div style="display:flex;align-items:center;gap:8px">';
    pt+='<span style="font-size:10px;color:var(--muted2);min-width:55px">Ocio TC</span>';
    pt+='<div style="flex:1;height:5px;background:var(--surface2);border-radius:2px;position:relative;overflow:visible">';
    pt+='<div style="width:'+Math.min(totalIdle/maxBar*100,100)+'%;height:100%;background:var(--under);border-radius:2px"></div>';
    pt+='<div style="position:absolute;left:calc('+Math.min(cityId/maxBar*100,100)+'% - 3px);top:-4px;width:8px;height:8px;background:#fff;border-radius:50%;z-index:3;box-shadow:0 0 3px rgba(0,0,0,.5)"></div>';
    pt+='</div>';
    pt+='<span style="font-size:10px;font-family:JetBrains Mono,monospace;min-width:100px;text-align:right"><span style="color:var(--muted2)">'+Math.round(cityId*10)/10+'</span> <span style="color:var(--under);font-weight:600">-'+Math.round(totalIdle*10)/10+'h</span></span>';
    pt+='</div>';
    // Green bar (cost): P=programmed, R=cost
    var costDiff=costHrs-totProg;
    pt+='<div style="display:flex;align-items:center;gap:8px">';
    pt+='<span style="font-size:10px;color:var(--muted2);min-width:55px">Costo</span>';
    pt+='<div style="flex:1;height:5px;background:var(--surface2);border-radius:2px;position:relative;overflow:visible">';
    pt+='<div style="width:'+Math.min(costHrs/maxCost*100,100)+'%;height:100%;background:var(--green);border-radius:2px"></div>';
    pt+='<div style="position:absolute;left:calc('+Math.min(totProg/maxCost*100,100)+'% - 3px);top:-4px;width:8px;height:8px;background:#fff;border-radius:50%;z-index:3;box-shadow:0 0 3px rgba(0,0,0,.5)"></div>';
    pt+='</div>';
    pt+='<span style="font-size:10px;font-family:JetBrains Mono,monospace;min-width:100px;text-align:right"><span style="color:var(--muted2)">'+Math.round(totProg)+'</span> <span style="color:var(--green);font-weight:600">'+Math.round(costHrs)+'h</span></span>';
    pt+='</div>';
    // Legend
    pt+='<div style="font-size:8px;color:var(--muted2);display:flex;gap:10px">';
    pt+='<span>\u26aa Extra/Ocio = promedio ciudad</span>';
    pt+='<span>\u26aa Costo = horas programadas</span>';
    pt+='</div>';
    pt+='</div>';
    pdvPanel.innerHTML+= pt;
    sec.appendChild(pdvPanel);
    
    var tTitle=document.createElement('div');tTitle.className='track-title';tTitle.textContent='\ud83d\udc64 Control Individual';sec.appendChild(tTitle);
    // dayLbl (legacy) queda como fallback si un HTML viejo no trae DAY_LABEL con formato fecha;
    // en modo mensual el header usa directamente DAY_LABEL[dk] = 'M 1/07' etc.
    var dayLbl=['Lun','Mar','Mi\u00e9','Jue','Vie','S\u00e1b','Dom','Lun','Mar','Mi\u00e9','Jue','Vie','S\u00e1b','Dom'];
    var byArea={};track.forEach(function(e){if(!byArea[e.zona])byArea[e.zona]=[];byArea[e.zona].push(e);});
    var bdrR='border-right:1px solid var(--border)';

    ['Sal\u00f3n','Cocina','Barra','Admin'].forEach(function(zona){
      var emps=byArea[zona];if(!emps||!emps.length)return;
      var color=AC[zona]||'#888';

      var panel=document.createElement('div');panel.className='panel';panel.style.marginBottom='12px';
      panel.innerHTML='<div class="panel-hdr">'+zona+' <span style="color:var(--muted);font-weight:400;font-size:12px">('+emps.length+')</span></div>';

      var sorted=emps.slice().sort(function(a,b){return (b.acum_real-b.acum_prog)-(a.acum_real-a.acum_prog);});

      var t='<table class="sched" style="font-size:12px"><thead><tr>';
      t+='<th style="min-width:30px;font-size:11px;border-bottom:2px solid var(--border)"></th><th style="text-align:left;min-width:140px;font-size:12px"></th>';
      dks.forEach(function(dk,i){var _lbl=(typeof DAY_LABEL!=='undefined'&&DAY_LABEL[dk])?DAY_LABEL[dk]:dayLbl[i%14];t+='<th colspan="2" style="min-width:50px;font-size:11px;border-bottom:2px solid var(--border);'+bdrR+'">'+_lbl+'</th>';});
      t+='<th colspan="3" style="font-size:11px;border-bottom:2px solid var(--border);border-left:2px solid var(--border);text-align:center;padding:2px 4px">Mes</th>';
      t+='</tr><tr>';
      t+='<th style="font-size:10px;color:var(--muted2)">Meta</th><th style="text-align:left;font-size:10px;color:var(--muted2)"></th>';
      dks.forEach(function(){t+='<th style="font-size:10px;color:var(--muted2)">P</th><th style="font-size:10px;color:var(--green);'+bdrR+'">R</th>';});
      t+='<th style="font-size:10px;color:var(--muted2);padding:2px 1px;text-align:center;border-left:2px solid var(--border)">P</th><th style="font-size:10px;color:var(--green);padding:2px 1px;text-align:center">R</th><th style="font-size:10px;color:var(--muted2);padding:2px 1px;text-align:center">\u0394</th>';
      t+='</tr></thead><tbody>';

      sorted.forEach(function(emp){
        t+='<tr>';
        t+='<td style="padding:3px 6px;opacity:.35;border-bottom:none;font-size:11px">'+emp.meta+'</td>';
        t+='<td style="text-align:left;font-family:DM Sans,sans-serif;font-weight:500;font-size:12px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;color:var(--text);border-bottom:none" title="'+emp.nombre+'">'+emp.nombre+'</td>';

        dks.forEach(function(dk){
          var d=emp.dias[dk]||{prog:0,real:0,status:'EMPTY',alert:''};
          if(d.status==='DESC'&&d.real===0){
            t+='<td colspan="2" style="padding:3px 2px;opacity:.25;font-size:10px;border-bottom:none;text-align:center;'+bdrR+'">DESC</td>';
            return;
          }
          if(d.status==='VNES'&&d.real===0){
            t+='<td colspan="2" style="padding:3px 2px;opacity:.4;font-size:10px;border-bottom:none;text-align:center;color:#818cf8;'+bdrR+'">VNES</td>';
            return;
          }
          if(d.status==='LICM'){
            t+='<td colspan="2" style="padding:3px 2px;opacity:.4;font-size:10px;border-bottom:none;text-align:center;color:#f472b6;'+bdrR+'">LICM</td>';
            return;
          }
          if(d.status==='NUEVO'){
            /* REGLA 28-jul (Clemente): dia anterior a la fecha de ingreso segun
               nomina (fechas_ingreso.json) â€” no genera ocio falso, badge NVO. */
            t+='<td colspan="2" style="padding:3px 2px;font-size:10px;border-bottom:none;text-align:center;background:#0c4a6e;color:#bae6fd;font-weight:600;'+bdrR+'" title="Aun no habia ingresado a la empresa (fecha ingreso segun nomina)">NVO</td>';
            return;
          }
          if(d.status==='NOVEDAD'){
            // Etiqueta segÃºn novedad_tipo (VAC/INCP/CD/LMATER/LR/LNR/PERM/SUSP/CUMPLE/REN/AUSENCIA N)
            var nv=(d.novedad||'').toString().toUpperCase();
            var esCD=(nv==='CD'||nv.indexOf('CALAM')===0);
            var esLR=(nv==='LR'||nv.indexOf('LR ')===0||nv.indexOf('LICENCIA REMUNERADA')===0||nv.indexOf('LUTO')===0);
            if(esCD||esLR){
              /* REGLA 23-jul (Clemente): CALAMIDAD DOMESTICA no reduce jornada.
                 REGLA 27-jul (Clemente): LICENCIA REMUNERADA (LR, incluye Luto) igual que CD.
                 OJO: LNR (no remunerada) NO entra aqui.
                 La P del dia SI suma al programado (genera ocio) â€” se muestra normal
                 y clickeable, y el badge (con su color) va en el lugar de la R. */
              var nvBadge=esCD?'CD':'LR';
              var nvBadgeBg=esCD?'#7c2d12':'#5b21b6';
              var nvBadgeColor=esCD?'#fed7aa':'#c4b5fd';
              var nvTitle=esCD?'CALAMIDAD DOMESTICA':'LICENCIA REMUNERADA';
              t+='<td style="padding:3px 3px;opacity:'+(d.prog===0?.3:0.5)+';border-bottom:none;cursor:pointer" onclick="mostrarModalP(\''+pdv+'\',\''+emp.doc+'\',\''+dk+'\')">'+d.prog+'</td>';
              t+='<td style="padding:3px 2px;font-size:10px;border-bottom:none;text-align:center;background:'+nvBadgeBg+';color:'+nvBadgeColor+';font-weight:700;'+bdrR+'" title="'+nvTitle+' - la P de este dia SI suma a la jornada">'+nvBadge+'</td>';
              return;
            }
            var novLabel=nv;var novBg='#581c87';var novColor='#e9d5ff';
            if(nv.startsWith('VAC')){novLabel='VAC';novBg='#155e75';novColor='#a5f3fc';}
            else if(nv.startsWith('INCP')||nv.startsWith('INC')){novLabel='INC';novBg='#831843';novColor='#fbcfe8';}
            else if(nv==='CD'){novLabel='CD';novBg='#7c2d12';novColor='#fed7aa';}
            else if(nv.startsWith('LMATER')){novLabel='LMAT';novBg='#4c1d95';novColor='#ddd6fe';}
            else if(nv.startsWith('LR')){novLabel='LR';novBg='#5b21b6';novColor='#c4b5fd';}
            else if(nv.startsWith('LNR')||nv.startsWith('PERM')){novLabel=nv.startsWith('LNR')?'LNR':'PERM';novBg='#3f3f46';novColor='#d4d4d8';}
            else if(nv.startsWith('SUSP')){novLabel='SUSP';novBg='#7c2d12';novColor='#fdba74';}
            else if(nv.startsWith('CUMPLE')){novLabel='&#127874;';novColor='#f0abfc';} /* torta como entidad HTML (ASCII puro): el emoji literal se danaba al incrustar el JS (mojibake) */
            else if(nv.startsWith('AUS')){novLabel='AUS';novBg='#3f3f46';novColor='#d4d4d8';}
            else if(nv.startsWith('REN')){novLabel='REN';novBg='#450a0a';novColor='#fca5a5';}
            t+='<td colspan="2" style="padding:3px 2px;font-size:10px;border-bottom:none;text-align:center;background:'+novBg+';color:'+novColor+';font-weight:600;'+bdrR+'" title="'+nv+'">'+novLabel+'</td>';
            return;
          }
          if(d.alert==='INC'){
            /* FIX 26-jul (caso Darlyn): con marcacion incompleta se muestra lo MAYOR
               conocido en la R (pares completos reales vs prog asumido). Antes, si el
               dia era DESCANSO (prog 0), un turno real trabajado quedaba oculto en 0. */
            var pInc=d.status==='DESC'?'D':d.prog;
            var rInc=Math.max(d.real||0,d.prog||0);
            t+='<td style="padding:3px 3px;opacity:'+(d.prog===0?.3:0.5)+';border-bottom:none;cursor:pointer" onclick="mostrarModalP(\''+pdv+'\',\''+emp.doc+'\',\''+dk+'\')">'+pInc+'</td>';
            t+='<td style="padding:3px 3px;font-weight:600;border-bottom:none;color:#facc15;'+bdrR+'" title="Marcacion incompleta â€” se muestra lo mayor conocido (real de pares completos o prog)">'+rInc+'</td>';
            return;
          }
          var cls='';
          if(d.alert==='FALTA'||d.alert==='DEFICIT')cls=' class="row-un"';
          else if(d.alert==='EXCESO'||d.alert==='EXTRA_DESC'||d.alert==='EXTRA_VNES')cls=' class="row-ov"';
          t+='<td'+cls+' style="padding:3px 3px;opacity:'+(d.prog===0?.3:0.5)+';border-bottom:none;cursor:pointer" onclick="mostrarModalP(\''+pdv+'\',\''+emp.doc+'\',\''+dk+'\')">'+d.prog+'</td>';
          var dayDiff=d.real-d.prog;
          var rColor=d.alert==='FALTA'?'var(--red)':dayDiff>2?'var(--over)':dayDiff<-2?'var(--under)':'var(--green)';
          var rVal=d.real||'\u2014';
          if(d.alert==='FALTA')rVal='\u2717';
          t+='<td'+cls+' style="padding:3px 3px;font-weight:600;color:'+rColor+';border-bottom:none;'+bdrR+'">'+rVal+'</td>';
        });

        var diff=emp.acum_real-emp.acum_prog;
        var realColor=diff>2?'var(--over)':diff<-2?'var(--under)':'var(--green)';
        
        t+='<td style="padding:2px 1px;opacity:.5;border-bottom:none;border-left:2px solid var(--border);text-align:center">'+emp.acum_prog+'</td>';
        t+='<td style="padding:2px 1px;font-weight:700;color:'+realColor+';border-bottom:none;text-align:center">'+emp.acum_real+'</td>';
        t+='<td style="padding:2px 1px;font-weight:600;color:'+realColor+';border-bottom:none;font-size:11px;text-align:center">'+(diff>0?'+':'')+Math.round(diff*10)/10+'</td>';
        t+='</tr>';

        // Progress bar row
        var pctReal=emp.meta>0?Math.min(emp.acum_real/emp.meta*100,100):0;
        var pctExpected=emp.meta>0?Math.min(emp.acum_prog/emp.meta*100,100):0;
        // Color: green if within 2h, blue if behind, orange if ahead
        var barColor=(emp.acum_real-emp.acum_prog)>2?'var(--over)':(emp.acum_real-emp.acum_prog)<-2?'var(--under)':'var(--green)';
        var totalCols=5+dks.length*2;

        t+='<tr><td colspan="'+totalCols+'" style="padding:0 6px 6px 6px;border-bottom:1px solid var(--surface2)">';
        t+='<div style="display:flex;align-items:center;gap:6px">';
        t+='<div style="flex:1;height:4px;background:var(--surface2);border-radius:2px;position:relative;overflow:visible">';
        // Actual bar
        t+='<div style="width:'+pctReal+'%;height:100%;background:'+barColor+';border-radius:2px;position:relative;z-index:1"></div>';
        // Expected marker: white dot on a line
        t+='<div style="position:absolute;left:'+pctExpected+'%;top:-3px;width:2px;height:10px;background:var(--muted2);z-index:2;border-radius:1px"></div>';

  var d=emp.dias[dayKey];
  var pad2=function(n){return n<10?'0'+n:''+n;};
  // Dias en HTML entities: L,M,Miercoles,J,V,Sabado,D
  var diaSemArr=['Lunes','Martes','Mi&#233;rcoles','Jueves','Viernes','S&#225;bado','Domingo','Lunes','Martes','Mi&#233;rcoles','Jueves','Viernes','S&#225;bado','Domingo'];
  var mesesEs=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var catIdx=(d.cat_idx!==undefined)?d.cat_idx:0;
  var diaSem=diaSemArr[catIdx]||'';
  var sem=(catIdx<7)?'S1':'S2';
  var headerTxt=diaSem+' '+sem;
  if(d.fecha_iso){
    var p=d.fecha_iso.split('-');
    if(p.length===3){
      var dd=parseInt(p[2],10), mm=parseInt(p[1],10);
      if(!isNaN(dd)&&!isNaN(mm)&&mm>=1&&mm<=12) headerTxt+=' &#183; '+dd+' de '+mesesEs[mm-1];
    }
  }
  var turnos=d.turnos||[];
  var turnosHtml='';
  function fmtRange(h1,h2){ return pad2(h1)+':00 &#8594; '+pad2(h2)+':00'; }
  for(var j=0;j<turnos.length;j++){
    var t=turnos[j], rng='';
    if(typeof t==='string' && t.indexOf('-')>=0){
      var pp=t.split('-'); var h1=parseInt(pp[0],10), h2=parseInt(pp[1],10);
      if(!isNaN(h1)&&!isNaN(h2)) rng=fmtRange(h1,h2);
    } else if(Array.isArray(t) && t.length===2){
      rng=fmtRange(parseInt(t[0],10), parseInt(t[1],10));
    }
    if(rng) turnosHtml+='<div style="font-family:JetBrains Mono,monospace;font-size:14px;color:var(--green);margin-top:4px">'+rng+'</div>';
  }
  if(!turnosHtml){
    if(d.status==='DESC') turnosHtml='<div style="color:var(--muted);font-size:13px;margin-top:4px">Descanso</div>';
    else if(d.status==='NOVEDAD') turnosHtml='<div style="color:var(--muted);font-size:13px;margin-top:4px">Novedad: '+(d.novedad||'').toString()+'</div>';
    else turnosHtml='<div style="color:var(--muted);font-size:13px;margin-top:4px">Sin turno programado</div>';
  }
  var prev=document.getElementById('modal-p-overlay'); if(prev) prev.remove();
  var overlay=document.createElement('div');
  overlay.id='modal-p-overlay';
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;';
  var card=document.createElement('div');
  card.style.cssText='background:#0f1117;border:1px solid #333;border-radius:10px;min-width:320px;max-width:90vw;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.6);font-family:DM Sans,sans-serif;';
  var html='<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #262a38">';
  html+='<div style="font-weight:600;font-size:14px;color:var(--text)">'+headerTxt+'</div>';
  html+='<div id="modal-p-close" style="cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:0 4px;user-select:none">&times;</div>';
  html+='</div>';
  html+='<div style="padding:14px 18px">';
  html+='<div style="font-weight:600;font-size:15px;color:var(--text);margin-bottom:4px">'+emp.nombre+'</div>';
  html+='<div style="color:var(--muted);font-size:12px;margin-bottom:12px;font-family:JetBrains Mono,monospace">CC: '+emp.doc+'</div>';
  html+='<div style="color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:.5px">Turno programado</div>';
  html+=turnosHtml;
  // FIX 17-jul: mostrar rangos reales ENTâ†’SAL (marcaciones del dÃ­a)
  var turnosR=d.turnos_reales||[];
  if(turnosR.length>0){
    html+='<div style="color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-top:12px">Horario real</div>';
    for(var k=0;k<turnosR.length;k++){
      var tr=String(turnosR[k]).replace(/â†’|->/,' &#8594; ');
      html+='<div style="font-family:JetBrains Mono,monospace;font-size:14px;color:#38bdf8;margin-top:4px">'+tr+'</div>';
    }
  }
  // FIX 17-jul: agregar bloque horas reales + diff
  var progH=(typeof d.prog==='number')?d.prog:0;
  var realH=(typeof d.real==='number')?d.real:0;
  var diffH=Math.round((realH-progH)*10)/10;
  var diffColor=diffH>0.5?'var(--over)':(diffH<-0.5?'var(--under)':'var(--green)');
  var diffTxt=(diffH>0?'+':'')+diffH+'h';
  html+='<div style="margin-top:14px;padding-top:12px;border-top:1px solid #262a38">';
  html+='<div style="color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:.5px">Resumen del d&#237;a</div>';
  html+='<div style="display:flex;gap:18px;margin-top:6px;font-family:JetBrains Mono,monospace;font-size:13px">';
  html+='<div><span style="color:var(--muted)">Prog:</span> <span style="color:var(--text);font-weight:600">'+progH+' h</span></div>';
  html+='<div><span style="color:var(--muted)">Real:</span> <span style="color:var(--text);font-weight:600">'+realH+' h</span></div>';
  html+='<div><span style="color:var(--muted)">Dif:</span> <span style="color:'+diffColor+';font-weight:600">'+diffTxt+'</span></div>';
  html+='</div>';
  if(d.alert && d.alert!==''){
    var alertMap={FALTA:'Falt&#243;',DEFICIT:'D&#233;ficit',EXCESO:'Exceso',EXTRA_DESC:'Trabaj&#243; en descanso',NOVEDAD:'Novedad',INC:'Marcaci&#243;n incompleta'};
    var alertTxt=alertMap[d.alert]||d.alert;
    html+='<div style="margin-top:8px;font-size:11px;color:var(--muted);font-style:italic">Alerta: '+alertTxt+'</div>';
  }
  html+='</div>';
  html+='</div>';
  card.innerHTML=html;
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  function cerrar(){
    var o=document.getElementById('modal-p-overlay'); if(o) o.remove();
    document.removeEventListener('keydown', escHandler);
  }
  function escHandler(e){ if(e.key==='Escape'||e.keyCode===27) cerrar(); }
  overlay.addEventListener('click', function(e){ if(e.target===overlay) cerrar(); });
  var closeBtn=document.getElementById('modal-p-close');
  if(closeBtn) closeBtn.addEventListener('click', cerrar);
  document.addEventListener('keydown', escHandler);
}


</script>
</body>
</html>
